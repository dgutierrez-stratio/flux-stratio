version: 2

builds:
  - id: flux-stratio
    main: ./cmd/flux-stratio
    binary: flux-stratio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Stratio/flux-stratio/internal/cli.version={{.Version}}

archives:
  - id: flux-stratio
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Stratio
    name: flux-stratio

changelog:
  sort: asc
