version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
